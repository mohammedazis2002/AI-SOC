    #   #environment:
    #     #- MODEL=/models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    #     #- HOST=0.0.0.0
    #     #- PORT=8081
    #     #- N_CTX=4096
    #     #- N_THREADS=8
    #   #command: >
    #     #python -m llama_cpp.server
    #     #--model /models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    #     #--host 0.0.0.0
    #     #--port 8081
    #     #--n_ctx 4096
    #     #--n_threads 8
    #   #networks:
    #     #- soar-network
    #   # Uncomment if you have a GPU
    #   # deploy:
    #   #   resources:
    #   #     reservations:
    #   #       devices:
    #   #         - driver: nvidia
    #   #           count: 1
    #   #           capabilities: [gpu]
    #   #healthcheck:
    #     #test: ["CMD", "ollama", "list"] #["CMD", "curl", "-f", "http://localhost:8081/health"]
    #     #interval: 30s
    #     #timeout: 10s
    #     #retries: 3
    #     #start_period: 60s

  agentic-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: soar-backend:latest
    container_name: soar-agent-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - MONGODB_HOST=mongodb
      - QDRANT_HOST=qdrant
      - PYTHONPATH=/app
      # ChatOllama expects base URL (no /v1/... suffix)
      - LLM_API_URL=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soar-network
    command: uvicorn backend.services.agentic.api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  agentic-dispatcher:
    image: soar-backend:latest
    container_name: soar-agent-dispatcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AGENT_API_URL=http://agentic-api:8000
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017/
      - MONGODB_DATABASE=${MONGODB_DATABASE:-soar_db}
      - PYTHONPATH=/app
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      agentic-api:
        condition: service_healthy
    networks:
      - soar-network
    healthcheck:
      disable: true
    command: python -m backend.services.agentic.dispatcher

  # Cybolt web UI — FastAPI auth API (see web_app/)
  web-app-backend:
    build:
      context: ./web_app/backend
      dockerfile: Dockerfile
    container_name: soar-web-app-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=${MONGODB_DATABASE:-soar_db}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_AUTH_SOURCE=${MONGODB_AUTH_SOURCE:-admin}
      - JWT_SECRET=${JWT_SECRET}
      # System health probes use Docker DNS; .env often has localhost which fails inside this container.
      - VAULT_ADDR=http://vault:8200
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - OLLAMA_HOST=ollama
      # System /health HTTP probes — use compose service names (not localhost from .env).
      - AGENT_API_URL=http://agentic-api:8000
      - ASSET_RISK_URL=http://asset-risk-evaluation:5005
      - ANOMALY_DETECTION_URL=http://anomaly-detection:5001
      - ATTACK_STAGE_URL=http://attack-stage-predictor:5002
      - ATTACK_FORECASTING_URL=http://attack-forecasting:5003
      - FALSE_POSITIVE_URL=http://false-positive-detector:5004
      - ROOT_CAUSE_URL=http://root-cause-analyzer:5006
      # Override .env if needed: reach mTLS cert API on the compose network (service `api`, port 8443).
      - MTLS_CERT_API_URL=${MTLS_CERT_API_URL:-https://api:8443/api/v1/certificates}
    ports:
      - "8001:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - soar-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  soar-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  loki_data:
  ollama_data:
    driver: local
  vault_data:
