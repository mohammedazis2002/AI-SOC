# Redis Configuration for SOAR Platform

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Security
requirepass change_this_redis_password

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru

# Streams Configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# Logging
loglevel notice
logfile ""

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Replication (for future HA setup)
# replicaof <masterip> <masterport>
# masterauth <master-password>
